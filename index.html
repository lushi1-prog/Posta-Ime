<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123f78">
<title>Posta-Ime v0.4.2</title>
<style>
:root{--blue:#123f78;--blue2:#245fa4;--gold:#f2c94c;--bg:#f4f7fb;--text:#142033;--muted:#66758a;--line:#e4eaf2}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:86px}.hero{background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;padding:22px 18px 26px;border-radius:0 0 30px 30px;box-shadow:0 12px 30px rgba(18,63,120,.16)}
.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center;font-size:23px;font-weight:850}.mark{width:42px;height:42px;border-radius:14px;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:23px}.badge{font-size:11px;padding:6px 9px;border:1px solid rgba(255,255,255,.3);border-radius:999px}
.hero h1{font-size:29px;margin:25px 0 7px;letter-spacing:-.7px}.hero p{margin:0;color:rgba(255,255,255,.83);line-height:1.45}.flagline{margin-top:18px;display:flex;align-items:center;gap:8px;font-size:12px}.star{color:var(--gold)}
.content{padding:18px}.section-title{font-size:18px;margin:4px 0 12px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-card,.notice,.tile{font:inherit;color:inherit;cursor:pointer}.summary-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;text-align:left}.summary-card b{font-size:23px;display:block}.summary-card span{font-size:12px;color:var(--muted)}
.notice{width:100%;text-align:left;background:#fff9e8;border:1px solid #f4df9c;border-radius:17px;padding:13px;margin:14px 0;font-size:13px;line-height:1.45}
.quickbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.quickbar::-webkit-scrollbar{display:none}.quickpill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;font:inherit;font-size:13px;font-weight:700;color:var(--blue);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.tile{appearance:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:16px 13px;text-align:left;min-height:126px;box-shadow:0 4px 14px rgba(31,54,84,.04)}.tile:active{transform:scale(.98)}.icon{font-size:29px}.tile strong{display:block;margin-top:10px;font-size:15px}.tile small{display:block;margin-top:4px;color:var(--muted);line-height:1.35}
.panel{display:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;position:relative}.panel.show{display:block}.close{position:absolute;right:11px;top:10px;border:0;background:#eef3f8;width:34px;height:34px;border-radius:50%;font-size:21px;cursor:pointer;z-index:3}.panel h3{margin:0 42px 8px 0}.panel p{color:var(--muted);line-height:1.5}.item{padding:12px;background:#f7f9fc;border-radius:13px;margin:8px 0}.action{border:0;background:var(--blue);color:#fff;border-radius:13px;padding:12px 14px;font-weight:750;margin-top:8px;cursor:pointer}

@media(max-width:600px){
  .panel{display:none!important}
}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;text-align:center;font-size:11px;color:var(--muted);cursor:pointer}.nav span{font-size:21px;display:block;margin-bottom:3px}.nav .active{color:var(--blue);font-weight:700}

.family-hero{background:linear-gradient(145deg,#eef5ff,#fff);border:1px solid #d9e6f6;border-radius:18px;padding:15px;margin:10px 0}
.family-hero strong{display:block;font-size:16px;margin-bottom:4px}.family-hero small{color:var(--muted);line-height:1.4}
.person{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:15px;margin:9px 0;background:#fff}
.avatar{width:42px;height:42px;border-radius:50%;background:#eef3f8;display:grid;place-items:center;font-size:21px}
.person-info{flex:1}.person-info b{display:block}.person-info small{color:var(--muted)}
.status{font-size:11px;font-weight:800;background:#eaf7ef;color:#267447;border-radius:999px;padding:5px 8px}
.permission{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.permission:last-child{border-bottom:0}.permission span{font-size:14px}.permission input{width:20px;height:20px;accent-color:var(--blue)}
.family-label{display:block;font-size:12px;font-weight:800;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.family-select,.family-date{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font:inherit;color:var(--text)}
.family-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.secondary{border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:13px;padding:11px 13px;font-weight:750;cursor:pointer}
.danger{border:1px solid #f1c9c9;background:#fff4f4;color:#9b3030;border-radius:13px;padding:11px 13px;font-weight:750;cursor:pointer}
.demo-note{font-size:12px;color:var(--muted);background:#f7f9fc;border-radius:12px;padding:10px;margin-top:10px;line-height:1.4}


.inline-panel{
  grid-column:1/-1;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin:0 0 2px;
  box-shadow:0 8px 24px rgba(31,54,84,.08);
}
.inline-panel h3{margin:0 38px 7px 0;font-size:17px}
.inline-panel p{color:var(--muted);line-height:1.45;margin:0 0 10px}
.inline-close{
  float:right;border:0;background:#eef3f8;width:32px;height:32px;
  border-radius:50%;font-size:19px;cursor:pointer;margin:-3px -2px 4px 8px
}
.inline-panel .item{margin:7px 0}
.quick-inline{margin:8px 0 14px}
.summary-inline{grid-column:1/-1}

footer{text-align:center;color:#8995a5;font-size:11px;padding:26px 12px 0}
</style>
</head>
<body>
<div class="app">
<header class="hero">
<div class="top"><div class="brand"><div class="mark">✉️</div>Posta-Ime</div><div class="badge">v0.4.2</div></div>
<h1>Posta jote, në një vend.</h1>

<main class="content">
<h2 class="section-title">Mirë se erdhe, Arben</h2>

<div class="grid">
<button class="tile" data-key="inbox"><span class="icon">📬</span><strong>Posta ime</strong><small>Letra dhe dokumente të reja.</small></button>
<button class="tile" data-key="bills"><span class="icon">💡</span><strong>Faturat</strong><small>Energji, ujë, internet dhe të tjera.</small></button>
<button class="tile" data-key="pay"><span class="icon">💳</span><strong>Paguaj</strong><small>Paguaj dhe ruaj historikun.</small></button>
<button class="tile" data-key="government"><span class="icon">🏛️</span><strong>Institucionet</strong><small>Njoftime dhe dokumente zyrtare.</small></button>
<button class="tile" data-key="bank"><span class="icon">🏦</span><strong>Banka</strong><small>Dokumente dhe njoftime bankare.</small></button>
<button class="tile" data-key="salary"><span class="icon">💼</span><strong>Paga ime</strong><small>Fletëpagesat në një vend.</small></button>
<button class="tile" data-key="contracts"><span class="icon">📑</span><strong>Kontratat</strong><small>Ruaj dhe menaxho kontratat.</small></button>

<button class="tile" data-key="receipts"><span class="icon">🧾</span><strong>Kuponët</strong><small>Kuponë dhe dëshmi pagese.</small></button>
<button class="tile" data-key="archive"><span class="icon">🗄️</span><strong>Arkivi im</strong><small>Dokumentet e rëndësishme.</small></button>
<button class="tile" data-key="family"><span class="icon">🌍</span><strong>Familja & Diaspora</strong><small>Ndihmo familjen me leje të kufizuara dhe të sigurta.</small></button>
<button class="tile" data-key="insurance"><span class="icon">🛡️</span><strong>Sigurimet</strong><small>Polica, njoftime dhe afate.</small></button>
<button class="tile" data-key="health"><span class="icon">🏥</span><strong>Shëndetësia</strong><small>Dokumente, termine dhe njoftime.</small></button>
<button class="tile" data-key="vehicle"><span class="icon">🚗</span><strong>Automjeti</strong><small>Regjistrim, sigurim dhe dokumente.</small></button>

<button class="tile" data-key="search"><span class="icon">🔎</span><strong>Kërko</strong><small>Gjej dokumente shpejt.</small></button>
<button class="tile" data-key="upload"><span class="icon">📤</span><strong>Ngarko dokument</strong><small>Ruaj dokumentet e tua.</small></button>
<button class="tile" data-key="receiptsauto"><span class="icon">🧾</span><strong>Kuponë automatikë</strong><small>Merr kuponët direkt nga bizneset.</small></button>
<button class="tile" data-key="paylater"><span class="icon">🕒</span><strong>Paguaj më vonë</strong><small>Zgjidh datën e pagesës.</small></button>
<button class="tile" data-key="sharebill"><span class="icon">👥</span><strong>Ndaj faturën</strong><small>Ndaje pagesën me familjen.</small></button>
<button class="tile" data-key="healthvisit"><span class="icon">📍</span><strong>Terminet</strong><small>Kalendari, lokacioni dhe kujtesat.</small></button>
<button class="tile" data-key="senders"><span class="icon">🏢</span><strong>Dërguesit</strong><small>Shiko kush dërgon në Posta-Ime.</small></button>
<button class="tile" data-key="profile"><span class="icon">🔐</span><strong>Siguria</strong><small>Identiteti, hyrja dhe privatësia.</small></button>
</div>
<div class="panel" id="panel"><button class="close" id="close">×</button><div id="panelContent"></div></div>
<footer>Posta-Ime © 2026 · Prototip konceptual për Kosovën · v0.4.2</footer>
</main>
<nav class="nav">
<button id="navHome" class="active"><span>🏠</span>Kryefaqja</button>
<button id="navInbox"><span>📬</span>Posta</button>
<button id="navNotifications"><span>🔔</span>Njoftimet</button>
<button id="navProfile"><span>👤</span>Profili</button>
</nav>
</div>
<script>
const data={
inbox:["Posta ime","Të gjitha letrat e rëndësishme në një vend.",["KESCO · Fatura e gushtit","Komuna · Njoftim i ri","Banka · Dokument mujor"],"Hap postën"],
bills:["Faturat","Shiko afatet dhe gjendjen e faturave.",["Energji · 42,80 € · 4 ditë","Internet · 19,99 € · 9 ditë","Ujë · Paguar"],"Shiko faturat"],
pay:["Paguaj","Prototip i pagesave nga Posta-Ime.",["Zgjidh faturën","Zgjidh mënyrën e pagesës","Merr konfirmimin"],"Vazhdo"],
government:["Institucionet","Dokumente dhe njoftime nga institucionet.",["Komuna","Administrata Tatimore","Shërbime publike"],"Shiko dokumentet"],
bank:["Banka","Dokumentet bankare pa letra.",["Njoftime","Ekstrakte","Kontrata"],"Hap bankën"],
salary:["Paga ime","Ruaj fletëpagesat sipas muajit.",["Gusht 2026","Korrik 2026","Qershor 2026"],"Shiko fletëpagesat"],
contracts:["Kontratat","Kontratat e tua të organizuara.",["Internet","Sigurim","Punë"],"Hap kontratat"],
sign:["Nënshkruaj","Dokumentet që presin miratimin tënd.",["1 dokument në pritje","Identifikim i sigurt","Konfirmim pas nënshkrimit"],"Shiko dokumentin"],
receipts:["Kuponët","Kuponë dhe dëshmi digjitale.",["Pagesa e energjisë","Pagesa e internetit","Pagesa komunale"],"Shiko kuponët"],
archive:["Arkivi im","Ruaj dokumente që dëshiron t'i kesh gjithmonë.",["Kontrata","Dëftesa","Dokumente personale"],"Hap arkivin"],
family:["Familja & Diaspora","Ndihmo një familjar në Kosovë ose jashtë vendit me qasje të kufizuar dhe të kontrolluar.",["Zgjidh personin","Cakto lejet","Vendos afatin","Hiq qasjen kur të duash"],"Menaxho autorizimet"],
insurance:["Sigurimet","Policat dhe afatet e sigurimit në një vend.",["Sigurimi i makinës · skadon 14 tetor","Sigurimi i shtëpisë · aktiv","Dokument i ri nga siguruesi"],"Hap sigurimet"],
health:["Shëndetësia","Dokumente dhe njoftime shëndetësore të ruajtura me kontroll të veçantë.",["Termini · 22 shtator 10:30","Raport mjekësor · i ri","Dokumentet private · të mbrojtura"],"Hap shëndetësinë"],
vehicle:["Automjeti","Dokumente të automjetit dhe afate të rëndësishme.",["Regjistrimi · skadon 30 nëntor","Sigurimi · aktiv","Kontroll teknik · 12 nëntor"],"Shiko automjetin"],
education:["Arsimi","Dokumentet e arsimit në një arkiv personal.",["Diploma universitare","Vërtetim shkolle","Certifikata trajnimi"],"Hap dokumentet"],
notifications:["Njoftimet","Të gjitha afatet e rëndësishme në një pamje.",["Faturë · 4 ditë","Sigurim · 47 ditë","Termini shëndetësor · 25 ditë"],"Shiko të gjitha"],
search:["Kërko","Kërko sipas emrit, institucionit ose datës.",["Shembull: KESCO","Shembull: diploma","Shembull: gusht 2026"],"Fillo kërkimin"],
upload:["Ngarko dokument","Shto dokumente personale në arkivin tënd.",["Zgjidh dokumentin","Emërto dokumentin","Ruaje në Arkiv"],"Ngarko dokument"],
receiptsauto:["Kuponë automatikë","Merr kuponët digjitalë direkt nga bizneset e lidhura.",["Market","Farmaci","Dyqan elektronik"],"Shiko kuponët"],
paylater:["Paguaj më vonë","Zgjidh datën kur dëshiron të paguhet fatura.",["Sot","Në datën e skadimit","Zgjidh një datë"],"Cakto pagesën"],
sharebill:["Ndaj faturën","Ndaje një faturë me një familjar pa ndarë llogarinë bankare.",["Zgjidh faturën","Zgjidh personin","Përcakto shumën"],"Ndaj faturën"],
healthvisit:["Terminet","Menaxho takimet dhe kujtesat.",["22 shtator · 10:30","Shto në kalendar","Shiko lokacionin"],"Hap terminin"],
senders:["Dërguesit","Shiko institucionet dhe bizneset që lidhen me Posta-Ime.",["KESCO","Komuna","Banka","Sigurimet"],"Shiko dërguesit"],
profile:["Siguria","Kontroll mbi llogarinë dhe privatësinë.",["Hyrje e sigurt","Pajisjet e mia","Lejet dhe privatësia"],"Hap sigurinë"]
};
const results={
inbox:"Posta u hap në versionin demo.",bills:"Faturat u hapën.",pay:"Demo: pagesa u konfirmua dhe kuponi u ruajt në Arkiv.",government:"Dokumentet institucionale u hapën.",bank:"Dokumentet bankare u hapën.",salary:"Fletëpagesat u hapën.",contracts:"Kontratat u hapën.",sign:"Demo: dokumenti u përgatit për identifikim dhe nënshkrim.",receipts:"Kuponët u hapën.",archive:"Arkivi personal u hap.",family:"Demo: mund të caktohet një autorizim i kufizuar për një familjar.",insurance:"Policat e sigurimit u hapën.",health:"Dokumentet shëndetësore u hapën me qasje të mbrojtur.",vehicle:"Dokumentet e automjetit u hapën.",education:"Dokumentet e arsimit u hapën.",notifications:"Të gjitha njoftimet u hapën.",search:"Demo: kërkimi për “KESCO” gjeti 4 dokumente.",upload:"Demo: dokumenti u zgjodh dhe është gati për ruajtje.",receiptsauto:"Kuponët automatikë u hapën.",paylater:"Demo: pagesa u caktua për datën e skadimit.",sharebill:"Demo: fatura u nda me një familjar.",healthvisit:"Termini u hap dhe mund të shtohet në kalendar.",senders:"Lista e dërguesve u hap.",profile:"Cilësimet e sigurisë u hapën."
};


function closeInlinePanels(){
 document.querySelectorAll(".inline-panel").forEach(p=>p.remove());
}

function basePanelHTML(key){
 const d=data[key];
 return `
   <button class="inline-close" aria-label="Stäng">×</button>
   <h3>${d[0]}</h3>
   <p>${d[1]}</p>
   ${d[2].map(x=>`<div class="item">${x}</div>`).join("")}
   <button class="action inline-action">${d[3]}</button>
   <div class="inline-result"></div>
 `;
}

function familyPanelHTML(){
 return `
   <button class="inline-close" aria-label="Stäng">×</button>
   <h3>🌍 Familja & Diaspora</h3>
   <p>Ndihmo një familjar pa i dhënë qasje të plotë në llogarinë tënde.</p>

   <div class="family-hero">
     <strong>Shembull: Prishtinë ↔ Suedi</strong>
     <small>Një prind në Kosovë mund t’i japë një familjari jashtë vendit leje vetëm për dokumentet ose faturat që zgjedh.</small>
   </div>

   <span class="family-label">Autorizim aktiv</span>
   <div class="person">
     <div class="avatar">👩</div>
     <div class="person-info"><b>Nëna · Prishtinë</b><small>Pronare e llogarisë</small></div>
     <span class="status">Aktive</span>
   </div>
   <div class="person">
     <div class="avatar">👨‍💼</div>
     <div class="person-info"><b>Arben · Suedi</b><small>Familjar i autorizuar</small></div>
     <span class="status">Leje e kufizuar</span>
   </div>

   <span class="family-label">Çfarë mund të bëjë familjari?</span>
   <div class="item">
     <label class="permission"><span>📬 Shiko dokumentet</span><input class="permDocs" type="checkbox" checked></label>
     <label class="permission"><span>💡 Shiko faturat</span><input class="permBills" type="checkbox" checked></label>
     <label class="permission"><span>💳 Paguaj faturat</span><input class="permPay" type="checkbox"></label>
     <label class="permission"><span>🛡️ Shiko sigurimet</span><input class="permInsurance" type="checkbox"></label>
   </div>

   <span class="family-label">Afati i autorizimit</span>
   <select class="familyExpiry family-select">
     <option value="30 ditë">30 ditë</option>
     <option value="3 muaj">3 muaj</option>
     <option value="1 vit" selected>1 vit</option>
     <option value="Pa afat">Pa afat</option>
   </select>

   <div class="family-actions">
     <button class="action saveFamily">Ruaj autorizimin</button>
     <button class="secondary newFamily">+ Shto familjar</button>
     <button class="danger revokeFamily">Hiq autorizimin</button>
   </div>
   <div class="familyResult"></div>
   <div class="demo-note">🔐 Para aktivizimit, identiteti verifikohet. Pronari mund t’i ndryshojë ose t’i heqë lejet në çdo kohë.</div>
 `;
}

function openInline(key, sourceEl){
 closeInlinePanels();

 const panel=document.createElement("div");
 panel.className="inline-panel";

 if(sourceEl.classList.contains("quickpill")) panel.classList.add("quick-inline");
 if(sourceEl.classList.contains("summary-card")) panel.classList.add("summary-inline");

 panel.innerHTML = key==="family" ? familyPanelHTML() : basePanelHTML(key);

 // Place directly after the clicked item.
 sourceEl.insertAdjacentElement("afterend", panel);

 panel.querySelector(".inline-close").onclick=()=>panel.remove();

 if(key==="family"){
   panel.querySelector(".saveFamily").onclick=()=>{
     const perms=[];
     if(panel.querySelector(".permDocs").checked) perms.push("dokumentet");
     if(panel.querySelector(".permBills").checked) perms.push("faturat");
     if(panel.querySelector(".permPay").checked) perms.push("pagesat");
     if(panel.querySelector(".permInsurance").checked) perms.push("sigurimet");
     const expiry=panel.querySelector(".familyExpiry").value;
     panel.querySelector(".familyResult").innerHTML=
       `<div class="item" style="margin-top:12px"><b>✓ Autorizimi u ruajt.</b><br><small>Qasje: ${perms.length?perms.join(", "):"asnjë leje"} · Afati: ${expiry}</small></div>`;
   };
   panel.querySelector(".newFamily").onclick=()=>{
     panel.querySelector(".familyResult").innerHTML=
       `<div class="item" style="margin-top:12px"><b>Demo:</b> Ftesa për një familjar të ri është gati për verifikim.</div>`;
   };
   panel.querySelector(".revokeFamily").onclick=()=>{
     panel.querySelector(".familyResult").innerHTML=
       `<div class="item" style="margin-top:12px;background:#fff4f4"><b>Autorizimi u hoq.</b><br><small>Familjari nuk ka më qasje në dokumente ose fatura.</small></div>`;
   };
 } else {
   panel.querySelector(".inline-action").onclick=()=>{
     panel.querySelector(".inline-result").innerHTML=
       `<div class="item" style="margin-top:12px"><b>✓</b> ${results[key]}</div>`;
   };
 }
}

document.querySelectorAll(".tile,.quick,.quickpill").forEach(el=>{
 el.addEventListener("click",()=>openInline(el.dataset.key,el));
});

// Legacy panel is kept hidden to avoid breaking older structure.
document.getElementById("close").onclick=()=>{
 document.getElementById("panel").classList.remove("show");
 document.body.classList.remove("panel-open");
};

function setNavActive(id){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}
document.getElementById("navHome").onclick=()=>{setNavActive("navHome");window.scrollTo({top:0,behavior:"smooth"});}
document.getElementById("navInbox").onclick=()=>{setNavActive("navInbox");openInline("inbox",document.querySelector(".summary-card[data-key=\"inbox\"]"));}
document.getElementById("navNotifications").onclick=()=>{setNavActive("navNotifications");openInline("notifications",document.querySelector(".tile[data-key=\"notifications\"]"));}
document.getElementById("navProfile").onclick=()=>{setNavActive("navProfile");openInline("profile",document.querySelector(".tile[data-key=\"profile\"]"));}
</script>
</body>
</html>
